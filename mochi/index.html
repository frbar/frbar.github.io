<style>
/* Mochi & les Mots — style « papier japonais » doux et coloré */

:root {
  --paper: #fbf3e4;
  --paper-2: #f4e7cf;
  --card: #fffdf8;
  --ink: #3b2f2f;
  --ink-soft: #7a6a5f;
  --sakura: #f28482;
  --sakura-light: #ffd6dc;
  --matcha: #84a59d;
  --matcha-dark: #52796f;
  --good: #3fa34d;
  --good-bg: #e3f6e0;
  --bad: #e5484d;
  --bad-bg: #ffe5e3;
  --gold: #f6bd60;
  --wood: #9c6b45;
  --theme: var(--sakura);
  --radius: 18px;
  --shadow: 0 3px 0 rgba(59, 47, 47, .12), 0 8px 20px rgba(59, 47, 47, .08);
  --tabbar-h: 64px;
  --font: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.45;
  color: var(--ink);
  background:
    radial-gradient(circle at 10% 0%, #ffe9ec 0, transparent 40%),
    radial-gradient(circle at 100% 30%, #e6f2ec 0, transparent 35%),
    var(--paper);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

#app {
  max-width: 760px;
  margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
}

body.in-lesson #app { padding-bottom: 40px; }
body.in-lesson #tabbar { display: none; }

[hidden] { display: none !important; }
body.demo::after {
  content: "MODE DÉMO · rien n'est enregistré"; position: fixed; top: env(safe-area-inset-top, 0px); right: 0; z-index: 60;
  background: var(--ink); color: #fff; font-size: .7em; font-weight: 800; padding: 3px 10px; border-bottom-left-radius: 10px;
}
h2, h3 { margin: 0; }
.muted { color: var(--ink-soft); }
.center { text-align: center; }
.small { font-size: .82em; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
.warn { color: var(--bad); font-weight: 600; }

/* ---------- Boutons ---------- */

button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }

.btn {
  border: 0;
  border-radius: 14px;
  padding: 12px 18px;
  font-weight: 700;
  background: var(--card);
  box-shadow: 0 3px 0 rgba(59, 47, 47, .18);
  transition: transform .08s, box-shadow .08s, background .2s;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(59, 47, 47, .18); }
.btn.primary { background: var(--theme); color: #fff; box-shadow: 0 4px 0 rgba(0, 0, 0, .2); }
.btn.primary:disabled { background: #d8cfc4; color: #fff; box-shadow: none; }
.btn.big { font-size: 1.1em; padding: 15px 22px; width: 100%; }
.btn.small { padding: 8px 12px; font-size: .9em; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.armed { background: var(--good) !important; animation: pulse .6s infinite alternate; }

.icon-btn {
  border: 0; background: var(--card); width: 42px; height: 42px; border-radius: 50%;
  font-size: 1.2em; font-weight: 800; box-shadow: var(--shadow); flex: none;
}

.chip {
  border: 2px solid transparent; background: var(--card); border-radius: 999px;
  padding: 7px 14px; font-weight: 700; box-shadow: 0 2px 0 rgba(59, 47, 47, .12);
}
.chip.active { border-color: var(--sakura); background: var(--sakura-light); }
.chip:disabled { opacity: .55; }

/* ---------- Barre d'onglets ---------- */

#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center; gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: rgba(255, 253, 248, .94);
  backdrop-filter: blur(8px);
  border-top: 1px solid #eadbc2;
}
#tabbar button {
  flex: 1; max-width: 150px; border: 0; background: none; border-radius: 14px;
  padding: 6px 4px; font-size: .78em; font-weight: 700; color: var(--ink-soft);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
#tabbar button span { font-size: 1.55em; line-height: 1.1; transition: transform .2s; }
#tabbar button.active { color: var(--ink); background: var(--sakura-light); }
#tabbar button.active span { transform: scale(1.15) translateY(-2px); }

/* ---------- En-tête de stats ---------- */

.stats { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
.stat {
  background: var(--card); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow);
  font-size: 1.02em; white-space: nowrap;
}
.stat small { color: var(--ink-soft); }

.page-title { text-align: center; font-size: 1.45em; margin: 6px 0 6px; }

.panel {
  background: var(--card); border-radius: var(--radius); padding: 16px; margin: 14px 0; box-shadow: var(--shadow);
}
.panel h3 { margin-bottom: 10px; }

/* ---------- Maison ---------- */

.room-tabs { display: flex; gap: 8px; justify-content: center; margin: 4px 0 10px; flex-wrap: wrap; }

.scene-wrap {
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  border: 6px solid #6f4529; background: #6f4529; line-height: 0;
}
.scene { width: 100%; height: auto; display: block; }
.scene .item, .scene .scene-cat { cursor: pointer; }
.scene .item-inner { transform-box: fill-box; transform-origin: 50% 100%; }
.scene .item.wiggle .item-inner { animation: wiggle .5s; }
.scene .item.pop-in .item-inner { animation: popIn .7s cubic-bezier(.3, 1.6, .5, 1); }

.scene .ryu, .thumb .ryu { transform-box: fill-box; transform-origin: center; animation: ryu 5s ease-in-out infinite; }
@keyframes ryu { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(-10px, -8px) rotate(-1.5deg); } }
.cat-tail { transform-box: fill-box; transform-origin: 0% 100%; animation: tail 2.6s ease-in-out infinite; }
.cat-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
.scene-cat { transition: transform .35s; }

.cat-talk {
  background: var(--card); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0;
  box-shadow: var(--shadow); position: relative;
}
.cat-talk::before {
  content: ""; position: absolute; top: -9px; left: 34px; border: 10px solid transparent;
  border-top: 0; border-bottom-color: var(--card);
}
.house-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.house-actions.with-wand { grid-template-columns: 1fr auto auto; }
.wand-btn { background: #efe4ff; box-shadow: 0 3px 0 #c9b2f0; }

/* Mode déplacement (baguette magique) */
.scene-wrap.editing { border-color: #7c3aed; box-shadow: 0 0 0 4px #e9d5ff, var(--shadow); }
.scene-wrap.editing .scene { touch-action: none; }
.scene-wrap.editing .item { cursor: grab; }
.scene-wrap.editing .item:active { cursor: grabbing; }
.scene-wrap.editing .scene-cat { pointer-events: none; opacity: .55; }
.scene-wrap.editing .item.selected .item-inner { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px #7c3aed); }
.edit-bar {
  background: #f5efff; border: 2px dashed #b794f4; border-radius: var(--radius); padding: 12px 14px; margin: 12px 0;
  display: grid; gap: 10px;
}
.edit-help { font-weight: 600; }
.edit-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.edit-actions [data-act="done"] { margin-left: auto; background: #7c3aed; }
@media (max-width: 420px) { .house-actions { grid-template-columns: 1fr; } }

/* ---------- Chemin des leçons ---------- */

.path { display: flex; flex-direction: column; align-items: stretch; margin-top: 14px; }
.path-node {
  position: relative; display: flex; align-items: center; gap: 14px; text-align: left;
  width: 86%; border: 0; background: var(--card); border-radius: 22px; padding: 12px 14px;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--theme) 55%, #000 0%), var(--shadow);
  border-left: 8px solid var(--theme); transition: transform .1s;
}
.path-node:active { transform: scale(.98); }
.path-node.left { align-self: flex-start; }
.path-node.right { align-self: flex-end; }
.node-icon {
  width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-size: 1.8em; background: color-mix(in srgb, var(--theme) 25%, #fff);
}
.node-text { display: flex; flex-direction: column; min-width: 0; }
.node-title { font-weight: 800; font-size: 1.08em; }
.node-sub { color: var(--ink-soft); font-size: .86em; }
.node-stars { color: var(--gold); font-size: 1.15em; letter-spacing: 1px; }
.node-stars .off { color: #e3d8c8; }
.node-stars small { color: var(--ink-soft); font-size: .72em; letter-spacing: 0; }
.new-tag {
  position: absolute; top: -9px; right: 12px; background: var(--bad); color: #fff; font-weight: 800;
  font-size: .72em; padding: 3px 9px; border-radius: 999px; transform: rotate(4deg);
  animation: pulse 1s infinite alternate;
}
.path-node.rest { opacity: .72; }
.node-state { font-size: .8em; font-weight: 800; border-radius: 999px; padding: 2px 9px; margin-top: 3px; width: fit-content; }
.node-state.retry { background: #ffedd5; color: #b45309; }
.node-state.rest { background: var(--paper-2); color: var(--ink-soft); }
.chapter {
  text-align: center; font-size: 1.05em; margin: 22px 0 12px; color: var(--ink-soft);
  text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 10px;
}
.chapter::before, .chapter::after { content: ""; flex: 1; border-top: 3px dotted #d9c6a5; }
.path > .chapter:first-child { margin-top: 4px; }
.rest-note { background: var(--paper-2); border-radius: 14px; padding: 12px 14px; font-weight: 600; }
.result-tag { font-weight: 800; color: #b45309; background: #ffedd5; border-radius: 999px; padding: 3px 12px; width: fit-content; margin: 0 auto 6px; }
.result-next { background: var(--paper); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; font-weight: 600; }
.path-dots {
  height: 34px; width: 0; margin: 0 auto; border-left: 5px dotted #d9c6a5;
}

/* ---------- Boutique ---------- */

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 8px; }
.shop-card {
  background: var(--card); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;
}
.shop-card.owned { outline: 3px solid var(--matcha); }
.shop-card.dim .thumb-wrap { filter: grayscale(.5); opacity: .75; }
.thumb-wrap {
  width: 100%; height: 118px; background: var(--paper-2); border-radius: 12px;
  display: flex; align-items: center; justify-content: center; padding: 8px;
}
.thumb { width: 100%; height: 100%; display: block; }
.shop-name { font-weight: 800; line-height: 1.2; }
.shop-desc { font-size: .78em; color: var(--ink-soft); line-height: 1.25; flex: 1; }
.shop-price { font-weight: 800; color: var(--wood); }
.lock { font-size: .8em; font-weight: 700; color: var(--ink-soft); background: var(--paper-2); border-radius: 10px; padding: 6px 8px; }

/* ---------- Profil ---------- */

.me-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.me-fields { flex: 1; min-width: 200px; display: grid; gap: 8px; }
.me-fields label, .intro-name { display: grid; gap: 4px; font-weight: 700; font-size: .9em; }
/* Champs des formulaires (profil, accueil) — les trous des exercices ont leur propre style (.fill-input). */
.me-fields input, .intro-name input, textarea {
  font: inherit; font-size: 1em; border: 2px solid #e6d7bd; border-radius: 12px; padding: 9px 12px;
  background: #fff; color: var(--ink); width: 100%;
}
.me-fields input:focus, .intro-name input:focus, textarea:focus { outline: none; border-color: var(--sakura); }
textarea { font-family: ui-monospace, monospace; font-size: .75em; resize: vertical; }
.coats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.coat {
  border: 3px solid transparent; border-radius: 999px; padding: 6px 12px 6px 30px; font-weight: 700;
  background: var(--paper-2); position: relative;
}
.coat::before {
  content: ""; position: absolute; left: 8px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
  border-radius: 50%; background: var(--fur); border: 1px solid rgba(0, 0, 0, .2);
}
.coat.active { border-color: var(--sakura); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.stat-grid div { background: var(--paper-2); border-radius: 12px; padding: 8px; text-align: center; display: flex; flex-direction: column; }
.stat-grid b { font-size: 1.3em; }
.stat-grid span { font-size: .75em; color: var(--ink-soft); }
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.trophy {
  background: var(--paper-2); border-radius: 12px; padding: 10px 8px; text-align: center;
  display: flex; flex-direction: column; gap: 2px; opacity: .6;
}
.trophy.won { opacity: 1; background: #fff4d6; box-shadow: inset 0 0 0 2px var(--gold); }
.t-emoji { font-size: 1.8em; }
.trophy small { font-size: .72em; color: var(--ink-soft); line-height: 1.2; }
.switch { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.switch input { width: 22px; height: 22px; accent-color: var(--sakura); }
.danger-zone { border: 2px dashed #f2b8b5; }

/* ---------- Intro ---------- */

.intro { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 10px; }
.intro-cat { animation: bob 2.2s ease-in-out infinite; cursor: pointer; }
.intro .bubble.big { font-size: 1.05em; }
.intro .bubble p { margin: 0 0 8px; }
.intro-name { width: 100%; max-width: 420px; }
.intro .btn.big { max-width: 420px; }

.bubble {
  background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  position: relative;
}

/* ---------- Leçon : fiche ---------- */

.lesson-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.lesson-title {
  flex: 1; font-weight: 800; font-size: 1.25em; background: var(--theme); color: #fff;
  border-radius: 999px; padding: 8px 18px; box-shadow: 0 4px 0 rgba(0, 0, 0, .15);
}
.sheet-hero { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.sheet-hero .cat-svg { flex: none; animation: bob 2.4s ease-in-out infinite; }
.sheet-hero .bubble { flex: 1; font-weight: 600; }
.sheet-hero .bubble::before {
  content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px;
  border: 9px solid transparent; border-left: 0; border-right-color: var(--card);
}
.sheet-card {
  background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  box-shadow: var(--shadow); border-top: 6px solid var(--theme);
  animation: slideUp .45s backwards;
}
.sheet-card h3 { font-size: 1.12em; margin-bottom: 6px; }
.sheet-card.trick { background: #fff7e0; border-top-color: var(--gold); }
.sheet-body p { margin: 6px 0; }
.sheet-body ul { margin: 6px 0; padding-left: 20px; }
.sheet-body li { margin: 3px 0; }
.sheet-body table { border-collapse: collapse; width: 100%; font-size: .95em; }
.sheet-body td, .sheet-body th { border-bottom: 1px solid #efe4d2; padding: 5px 6px; text-align: left; }
.sheet-body th { color: var(--ink-soft); font-size: .85em; }
.table-wrap { overflow-x: auto; }
.hl { background: color-mix(in srgb, var(--theme) 28%, #fff); border-radius: 6px; padding: 0 4px; font-weight: 800; }
.ok-ex::before { content: "✅ "; }
.ko-ex::before { content: "❌ "; }
.ko-ex { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--bad); }
.big-rule {
  font-size: 1.15em; font-weight: 800; text-align: center; background: var(--paper-2);
  border-radius: 12px; padding: 10px; margin: 8px 0;
}
.sheet-go { margin: 18px 0 6px; display: grid; gap: 8px; text-align: center; }

/* ---------- Leçon : quiz ---------- */

.quiz-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.paws { flex: 1; display: flex; gap: 4px; justify-content: center; }
.paw {
  flex: 1; max-width: 26px; height: 12px; border-radius: 999px; background: #e9dcc6; transition: background .3s, transform .3s;
}
.paw.current { background: var(--theme); transform: scaleY(1.4); }
.paw.ok { background: var(--good); }
.paw.ko { background: var(--bad); }
.quiz-fish { font-weight: 800; background: var(--card); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow); white-space: nowrap; }
.quit-confirm {
  background: var(--bad-bg); border-radius: 14px; padding: 12px; margin-bottom: 12px; font-weight: 600;
}
.combo-badge {
  text-align: center; font-weight: 800; color: #c2410c; background: #ffedd5; border-radius: 999px;
  padding: 4px 12px; margin: -4px auto 10px; width: fit-content; animation: pulse .7s infinite alternate;
}

.q-card {
  background: var(--card); border-radius: 22px; padding: 18px; box-shadow: var(--shadow);
  animation: slideUp .35s;
}
.q-num { font-size: .8em; font-weight: 800; color: var(--theme); text-transform: uppercase; letter-spacing: .06em; }
.q-prompt { font-weight: 800; font-size: 1.08em; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
.say-btn {
  border: 0; background: var(--sakura-light); border-radius: 50%; width: 38px; height: 38px; flex: none;
  font-size: 1.1em; margin-left: auto;
}
.q-sentence {
  font-size: 1.3em; line-height: 1.9; background: var(--paper); border-radius: 14px; padding: 12px 14px;
  margin-bottom: 14px; word-wrap: break-word;
}
.blank {
  display: inline-block; min-width: 2.4em; text-align: center; border-bottom: 3px dashed var(--theme);
  color: var(--theme); font-weight: 800; padding: 0 4px; line-height: 1.3;
}
.blank.filled { border-bottom-style: solid; color: var(--good); animation: popIn .4s; }

.choices { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.choices.n3 { grid-template-columns: 1fr 1fr 1fr; }
.choices.n4 { grid-template-columns: 1fr 1fr; }
.choice {
  border: 3px solid #eadbc2; background: #fff; border-radius: 16px; padding: 14px 10px; font-size: 1.2em;
  font-weight: 800; box-shadow: 0 4px 0 #eadbc2; transition: transform .08s;
}
.choice:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #eadbc2; }
.choice.good { border-color: var(--good); background: var(--good-bg); box-shadow: 0 4px 0 var(--good); animation: popIn .35s; }
.choice.bad { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 4px 0 var(--bad); animation: shake .4s; }
.choice:disabled:not(.good):not(.bad) { opacity: .5; }
.type-choice .choices.long { grid-template-columns: 1fr; }
.type-choice .choices.long .choice { font-size: 1em; text-align: left; padding: 12px 14px; }

.fill-sentence { line-height: 2.3; }
.fill-wrap { display: inline-block; }
.fill-input {
  font: inherit; font-weight: 800; color: var(--theme); text-align: center; border: 0;
  border-bottom: 3px solid var(--theme); background: #fff; border-radius: 8px 8px 0 0;
  box-sizing: content-box; padding: 3px 8px; line-height: 1.4; height: 1.4em;
  max-width: calc(100% - 16px); min-width: 3ch; vertical-align: baseline;
}
.fill-input:focus { outline: 3px solid var(--sakura-light); }
.fill-input.good { color: var(--good); border-color: var(--good); background: var(--good-bg); }
.fill-input.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }
.fix { color: var(--good); font-weight: 800; margin-left: 6px; animation: popIn .4s; display: inline-block; }
.accents { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; }
.accent {
  border: 0; background: var(--paper-2); border-radius: 10px; min-width: 40px; height: 40px; font-size: 1.15em; font-weight: 800;
  box-shadow: 0 2px 0 #e0cfb1;
}
.accent:active { transform: translateY(2px); box-shadow: none; }
.validate { width: 100%; }

.words { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; line-height: 1.4; }
.word {
  border: 2px solid transparent; background: #fff; border-radius: 10px; padding: 3px 8px; font-size: 1em;
  box-shadow: 0 2px 0 #eadbc2; font-weight: 600;
}
.word.picked { border-color: var(--theme); background: var(--sakura-light); transform: scale(1.06); }
.word.good { border-color: var(--good); background: var(--good-bg); }
.word.missed { border-color: #f59e0b; background: #fff3d6; }
.word.bad { border-color: var(--bad); background: var(--bad-bg); }
.word s { color: var(--bad); opacity: .75; }
.word:disabled { color: var(--ink); }

<script>/* js/core.js */
/* Mochi & les Mots — noyau : registre des contenus, sauvegarde, utilitaires.
 *
 * Règle d'or de la sauvegarde : on n'enregistre que des identifiants stables
 * (id d'exercice, id d'objet, empreinte de question). Ajouter des exercices
 * ou des objets ne fait donc jamais perdre les points ni l'avancement.
 */
(function () {
  'use strict';

  const SAVE_KEY = 'revifun.save.v1';

  const exercises = [];
  const items = [];

  function registerExercise(ex) {
    if (exercises.some(e => e.id === ex.id)) {
      console.warn('Exercice en double ignoré :', ex.id);
      return;
    }
    exercises.push(ex);
    exercises.sort((a, b) => (a.order || 0) - (b.order || 0));
  }

  function registerItem(item) {
    if (items.some(i => i.id === item.id)) {
      console.warn('Objet en double ignoré :', item.id);
      return;
    }
    items.push(item);
  }

  /* ---------- Sauvegarde ---------- */

  function defaultSave() {
    return {
      version: 1,
      playerName: '',
      catName: 'Mochi',
      catColor: 'roux',
      sound: true,
      fish: 0,
      fishEarned: 0,
      sessions: 0,
      perfectSessions: 0,
      bestCombo: 0,
      lessons: {},      // id -> voir newLessonRecord()
      owned: [],        // ids des objets achetés
      stored: [],       // objets achetés mais rangés (non affichés)
      positions: {},    // id d'objet -> { x, y, z } choisis avec la baguette magique
      trophies: [],     // ids des trophées gagnés
      streak: { last: null, days: 0, best: 0 },
      introDone: false,
    };
  }

  // Fusion tolérante : ce qui manque dans une ancienne sauvegarde prend la valeur
  // par défaut, ce qui existe déjà (points, objets, progression) est conservé.
  function upgrade(data) {
    const base = defaultSave();
    if (!data || typeof data !== 'object') return base;
    const out = Object.assign(base, data);
    out.streak = Object.assign(defaultSave().streak, data.streak || {});
    ['owned', 'stored', 'trophies'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
    if (!out.lessons || typeof out.lessons !== 'object') out.lessons = {};
    if (!out.positions || typeof out.positions !== 'object') out.positions = {};
    Object.keys(out.lessons).forEach(id => {
      out.lessons[id] = Object.assign(newLessonRecord(), out.lessons[id]);
    });
    out.version = 1;
    return out;
  }

  let storageOk = true;

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      return upgrade(raw ? JSON.parse(raw) : null);
    } catch (e) {
      storageOk = false;
      return defaultSave();
    }
  }

  let save = load();
  let demo = false;

  // Mode démo (index.html#demo) : tout est débloqué, rien n'est enregistré.
  function startDemo() {
    demo = true;
    save = defaultSave();
    save.introDone = true;
    save.playerName = 'Démo';
    save.fish = 999;
    save.owned = items.map(i => i.id);
    // Quelques leçons dans chaque état : validée (au repos), à corriger, jamais faite.
    exercises.forEach((ex, n) => {
      if (n > 9) return;
      save.lessons[ex.id] = Object.assign(newLessonRecord(), {
        attempts: 2, best: n === 0 ? 10 : 8, stars: n === 0 ? 3 : 2, perfects: n === 0 ? 1 : 0, last: today(),
        doneDay: n === 0 ? today() : null,
        pending: n === 1 ? ex.questions.slice(0, 2).map(q => hash(JSON.stringify(q))) : [],
      });
    });
    save.streak = { last: today(), days: 4, best: 4 };
    save.trophies = ['first', 'perfect', 'combo5', 'explorer', 'decorator', 'streak3', 'garden'];
  }

  function persist() {
    if (demo) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
      storageOk = true;
    } catch (e) {
      storageOk = false;
    }
  }

  function newLessonRecord() {
    return {
      attempts: 0,
      best: 0,          // meilleur score sur une partie complète
      stars: 0,
      perfects: 0,
      missed: [],       // questions ratées en partie complète (reviennent en priorité plus tard)
      pending: [],      // questions ratées à la dernière partie : à corriger en rattrapage
      doneDay: null,    // jour où la leçon a été réussie en entier (repos jusqu'à J+2)
      last: null,
    };
  }

  function lessonRecord(id) {
    if (!save.lessons[id]) save.lessons[id] = newLessonRecord();
    return save.lessons[id];
  }

  function peekLesson(id) {
    return save.lessons[id] || newLessonRecord();
  }

  function exportCode() {
    return btoa(unescape(encodeURIComponent(JSON.stringify(save))));
  }

  function importCode(code) {
    const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!data || typeof data !== 'object' || typeof data.fish !== 'number') {
      throw new Error('Code invalide');
    }
    save = upgrade(data);
    persist();
  }

  function reset() {
    save = defaultSave();
    persist();
  }

  /* ---------- Utilitaires ---------- */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // Empreinte courte et stable d'une question (sert à mémoriser les erreurs).
  function hash(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  // Comparaison des réponses tapées : on tolère majuscules, espaces et apostrophes
  // typographiques, mais PAS les accents (é ≠ e, à ≠ a : c'est tout l'enjeu !).
  function normalize(s) {
    return String(s)
      .normalize('NFC')
      .replace(/[’‘`´]/g, "'")
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  function dayString(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function today() { return dayString(new Date()); }

  function yesterday() { return addDays(today(), -1); }

  function addDays(day, n) {
    const [y, m, d] = day.split('-').map(Number);
    return dayString(new Date(y, m - 1, d + n));
  }

  // « demain », « après-demain » ou « jeudi 19 novembre ».
  function dayLabel(day) {
    if (day === addDays(today(), 1)) return 'demain';
    if (day === addDays(today(), 2)) return 'après-demain';
    const [y, m, d] = day.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function totalStars() {
    return exercises.reduce((sum, ex) => sum + (peekLesson(ex.id).stars || 0), 0);
  }

  function maxStars() { return exercises.length * 3; }

  window.ReviFun = {
    registerExercise,
    registerItem,
    exercises,
    items,
    get save() { return save; },
    get storageOk() { return storageOk; },
    get demo() { return demo; },
    startDemo,
    persist,
    lessonRecord,
    peekLesson,
    exportCode,
    importCode,
    reset,
    getExercise: id => exercises.find(e => e.id === id),
    getItem: id => items.find(i => i.id === id),
    esc,
    shuffle,
    pick,
    hash,
    normalize,
    today,
    yesterday,
    addDays,
    dayLabel,
    totalStars,
    maxStars,
  };
})();

</script>
<script>/* js/fx.js */
/* Mochi & les Mots — effets : sons synthétisés, voix, pétales de sakura, toasts. */
(function () {
  'use strict';
  const R = window.ReviFun;

  /* ---------- Sons (Web Audio, aucun fichier externe) ---------- */

  let ctx = null;

  function audio() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, type, vol, slideTo) {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime + start;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(a.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function meow() {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime;
    const osc = a.createOscillator();
    const filter = a.createBiquadFilter();
    const gain = a.createGain();
    osc.type = 'sawtooth';
    const base = 480 + Math.random() * 160;
    osc.frequency.setValueAtTime(base, t0);
    osc.frequency.linearRampToValueAtTime(base * 1.7, t0 + 0.18);
    osc.frequency.linearRampToValueAtTime(base * 1.1, t0 + 0.55);
    filter.type = 'bandpass';
    filter.Q.value = 3;
    filter.frequency.setValueAtTime(900, t0);
    filter.frequency.linearRampToValueAtTime(1800, t0 + 0.2);
    filter.frequency.linearRampToValueAtTime(1000, t0 + 0.55);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    osc.connect(filter).connect(gain).connect(a.destination);
    osc.start(t0);
    osc.stop(t0 + 0.65);
  }

  const sounds = {
    good() { tone(660, 0, 0.12, 'triangle', 0.18); tone(990, 0.1, 0.2, 'triangle', 0.18); },
    bad() { tone(240, 0, 0.28, 'sawtooth', 0.05, 150); },
    tap() { tone(520, 0, 0.06, 'sine', 0.08, 700); },
    coin() { tone(988, 0, 0.08, 'square', 0.05); tone(1319, 0.08, 0.3, 'square', 0.05); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.3, 'triangle', 0.16)); },
    star() { tone(1200, 0, 0.15, 'sine', 0.12, 1800); },
    meow,
  };

  function play(name) {
    if (!R.save.sound) return;
    try { sounds[name] && sounds[name](); } catch (e) { /* audio indisponible */ }
  }

  /* ---------- Voix (lecture de phrases) ---------- */

  const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

  function speak(text) {
    if (!canSpeak) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.88;
    const voice = window.speechSynthesis.getVoices().find(v => /^fr(-|_)FR/i.test(v.lang))
      || window.speechSynthesis.getVoices().find(v => /^fr/i.test(v.lang));
    if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  /* ---------- Pétales de sakura ---------- */

  let petals = [];
  let rafId = null;

  function sakura(count) {
    const canvas = document.getElementById('petals');
    if (!canvas) return;
    const c = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#ffb7c5', '#ff8fab', '#ffd6e0', '#ffffff', '#ffc8dd'];
    for (let i = 0; i < (count || 80); i++) {
      petals.push({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * window.innerHeight * 0.6,
        r: 5 + Math.random() * 6,
        vx: -1 + Math.random() * 2,
        vy: 1.5 + Math.random() * 2.5,
        rot: Math.random() * Math.PI,
        vr: -0.08 + Math.random() * 0.16,
        sway: Math.random() * Math.PI * 2,
        color: R.pick(colors),
      });
    }
    if (!rafId) rafId = requestAnimationFrame(step);

    function step() {
      c.clearRect(0, 0, window.innerWidth, window.innerHeight);
      petals.forEach(p => {
        p.sway += 0.04;
        p.x += p.vx + Math.sin(p.sway) * 0.8;
        p.y += p.vy;
        p.rot += p.vr;
        c.save();
        c.translate(p.x, p.y);
        c.rotate(p.rot);
        c.fillStyle = p.color;
        c.beginPath();
        c.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
        c.fill();
        c.restore();
      });
      petals = petals.filter(p => p.y < window.innerHeight + 30);
      if (petals.length) {
        rafId = requestAnimationFrame(step);
      } else {
        c.clearRect(0, 0, window.innerWidth, window.innerHeight);
        rafId = null;
      }
    }
  }

  /* ---------- Toasts et textes flottants ---------- */

  let toastTimer = null;

  function toast(html, ms) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.innerHTML = html;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2200);
  }

  function floatText(anchor, text) {
    const r = anchor.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = (r.left + r.width / 2) + 'px';
    el.style.top = (r.top + window.scrollY) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  function hearts(anchor) {
    const r = anchor.getBoundingClientRect();
    for (let i = 0; i < 5; i++) {
      const el = document.createElement('div');
      el.className = 'heart';
      el.textContent = R.pick(['💗', '💕', '✨', '🐾']);
      el.style.left = (r.left + r.width * (0.2 + Math.random() * 0.6)) + 'px';
      el.style.top = (r.top + window.scrollY + r.height * 0.3) + 'px';
      el.style.animationDelay = (i * 0.08) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1600);
    }
  }

  R.fx = { play, speak, canSpeak, sakura, toast, floatText, hearts };
})();

</script>
<script>/* js/cat.js */

(function () {
  'use strict';
  const R = window.ReviFun;

  const COATS = {
    roux:  { name: 'Roux',  fur: '#f4a261', dark: '#d9822b', light: '#fde8cf' },
    gris:  { name: 'Gris',  fur: '#a3acb9', dark: '#6f7a8a', light: '#eef1f5' },

  function catSVG(mood, size) {

<script>/* js/house.js */
/* Mochi & les Mots — la maison japonaise : pièces, rendu de la scène, places du chat.
 *
 * Une scène fait 800 × 520 unités. Chaque objet (data/items.js) dessine son SVG
 * dans sa propre boîte `vb` et indique où il se pose : x, y (coin haut-gauche)
 * et w (largeur dans la scène). La hauteur suit les proportions de `vb`.
 */
(function () {
  'use strict';
  const R = window.ReviFun;

  const ROOMS = {
    salon: {
      name: 'Salon',
      emoji: '🏮',
      bg: `
        <rect width="800" height="520" fill="#f6ead2"/>
        <g stroke="#ecdcbc" stroke-width="2">${Array.from({ length: 19 }, (_, i) => `<line x1="${40 + i * 40}" y1="36" x2="${40 + i * 40}" y2="330"/>`).join('')}</g>
        <rect width="800" height="36" fill="#8a5a3b"/>
        <rect y="30" width="800" height="8" fill="#6f4529"/>
        <rect width="24" height="342" fill="#9c6b45"/>
        <rect x="776" width="24" height="342" fill="#9c6b45"/>
        <rect y="328" width="800" height="14" fill="#7a4b2e"/>
        <rect y="342" width="800" height="178" fill="#d9a066"/>
        <g stroke="#c48a52" stroke-width="3">
          <line x1="0" y1="384" x2="800" y2="384"/><line x1="0" y1="430" x2="800" y2="430"/><line x1="0" y1="480" x2="800" y2="480"/>
          <line x1="210" y1="342" x2="210" y2="384"/><line x1="560" y1="342" x2="560" y2="384"/>
          <line x1="120" y1="384" x2="120" y2="430"/><line x1="430" y1="384" x2="430" y2="430"/><line x1="700" y1="384" x2="700" y2="430"/>
          <line x1="300" y1="430" x2="300" y2="480"/><line x1="620" y1="430" x2="620" y2="480"/>
          <line x1="180" y1="480" x2="180" y2="520"/><line x1="500" y1="480" x2="500" y2="520"/>
        </g>`,
      // Places possibles du chat (il change de place quand on le touche).
      catSpots: [
        { x: 600, y: 372, w: 110 },
        { x: 175, y: 362, w: 100, needs: 'panier' },
        { x: 52, y: 92, w: 72, needs: 'arbre-a-chat' },
        { x: 318, y: 405, w: 92, needs: 'zabuton' },
        { x: 410, y: 380, w: 100 },
      ],
    },
    jardin: {
      name: 'Jardin',
      emoji: '🌸',
      unlock: { owned: 5 },
      bg: `
        <rect width="800" height="520" fill="#cfeaf4"/>
        <rect y="150" width="800" height="100" fill="#e3f3f8"/>
        <circle cx="640" cy="90" r="34" fill="#ffe8a3"/>
        <path d="M120 250 L300 110 L340 130 L380 108 L560 250 Z" fill="#9fb8cf"/>
        <path d="M300 110 L340 130 L380 108 L410 135 L370 150 L340 140 L300 150 L270 135 Z" fill="#fff"/>
        <rect y="230" width="800" height="290" fill="#a7c957"/>
        <g fill="#95b84a"><ellipse cx="120" cy="300" rx="60" ry="8"/><ellipse cx="520" cy="280" rx="80" ry="7"/><ellipse cx="700" cy="330" rx="50" ry="6"/></g>
        <rect y="176" width="800" height="70" fill="#d4b483"/>
        <g stroke="#b8955f" stroke-width="3">${Array.from({ length: 40 }, (_, i) => `<line x1="${10 + i * 20}" y1="176" x2="${10 + i * 20}" y2="246"/>`).join('')}</g>
        <rect y="190" width="800" height="7" fill="#7a5a3a"/><rect y="226" width="800" height="7" fill="#7a5a3a"/>
        <g fill="#c9c9c0" stroke="#a9a99f" stroke-width="2">
          <ellipse cx="250" cy="470" rx="34" ry="12"/><ellipse cx="300" cy="420" rx="30" ry="10"/><ellipse cx="270" cy="372" rx="26" ry="9"/>
        </g>
        <rect width="800" height="26" fill="#5c3d2e"/>
        <rect y="22" width="800" height="8" fill="#3e2a20"/>
        <rect y="478" width="800" height="42" fill="#b07b4f"/>
        <rect y="472" width="800" height="8" fill="#8a5a3b"/>
        <g stroke="#946338" stroke-width="2"><line x1="0" y1="498" x2="800" y2="498"/></g>`,
      catSpots: [
        { x: 60, y: 392, w: 100 },
        { x: 600, y: 395, w: 95 },
        { x: 380, y: 288, w: 70, needs: 'pont' },
      ],
    },
  };

  function isRoomUnlocked(roomId) {
    const room = ROOMS[roomId];
    if (!room.unlock) return true;
    return R.save.owned.length >= room.unlock.owned;
  }

  // Place réelle d'un objet : celle choisie avec la baguette magique, sinon celle d'origine.
  function placement(item) {
    const p = R.save.positions[item.id] || {};
    return { x: p.x ?? item.x, y: p.y ?? item.y, z: p.z ?? (item.z || 0) };
  }

  function transformOf(item, x, y) {
    return `translate(${x} ${y}) scale(${(item.w / item.vb[0]).toFixed(4)})`;
  }

  function placed(item, inner) {
    const p = placement(item);
    return `<g class="item" data-item="${item.id}" transform="${transformOf(item, p.x, p.y)}"><g class="item-inner">${inner}</g></g>`;
  }

  function visibleItems(roomId) {
    const s = R.save;
    return R.items
      .filter(it => it.room === roomId && s.owned.includes(it.id) && !s.stored.includes(it.id))
      .sort((a, b) => placement(a).z - placement(b).z);
  }

  // Les places du chat liées à un objet (panier, coussin…) suivent cet objet s'il a été déplacé.
  function catSpots(roomId) {
    const s = R.save;
    return ROOMS[roomId].catSpots
      .filter(sp => !sp.needs || (s.owned.includes(sp.needs) && !s.stored.includes(sp.needs)))
      .map(sp => {
        const it = sp.needs && R.getItem(sp.needs);
        if (!it) return sp;
        const p = placement(it);
        return Object.assign({}, sp, { x: sp.x + p.x - it.x, y: sp.y + p.y - it.y });
      });
  }

  // Rendu complet d'une pièce. `catSpot` : index dans catSpots(roomId).
  function sceneSVG(roomId, catSpot, mood) {
    const room = ROOMS[roomId];
    const list = visibleItems(roomId);
    const spots = catSpots(roomId);
    const spot = spots[Math.min(catSpot || 0, spots.length - 1)];
    // Le chat se dessine au-dessus des objets sur lesquels il est assis.
    const catZ = 4.5;
    const parts = [room.bg];
    let catDone = false;
    const catMarkup = `<g class="scene-cat" transform="translate(${spot.x} ${spot.y}) scale(${(spot.w / 120).toFixed(4)})">${R.cat.catInner(mood || 'normal', R.save.catColor)}</g>`;
    list.forEach(it => {
      if (!catDone && placement(it).z > catZ) { parts.push(catMarkup); catDone = true; }
      parts.push(placed(it, itemSvg(it)));
    });
    if (!catDone) parts.push(catMarkup);
    return `<svg class="scene" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${R.esc(room.name)}">${parts.join('')}</svg>`;
  }

  function thumbSVG(item) {
    const pad = Math.max(item.vb[0], item.vb[1]) * 0.06;
    return `<svg class="thumb" viewBox="${-pad} ${-pad} ${item.vb[0] + pad * 2} ${item.vb[1] + pad * 2}" aria-hidden="true">${itemSvg(item)}</svg>`;
  }

  // Un objet peut dessiner selon la progression : svg est alors une fonction (ctx) → chaîne SVG.
  function itemSvg(item) {
    if (typeof item.svg !== 'function') return item.svg;
    return item.svg({ stars: R.totalStars(), maxStars: R.maxStars(), trophies: R.save.trophies.length });
  }

  R.house = { ROOMS, isRoomUnlocked, sceneSVG, thumbSVG, catSpots, visibleItems, placement, transformOf };
})();

</script>
<script>/* js/questions.js */
/* Mochi & les Mots — les types de questions.
 *
 * Chaque type est une fonction (q, el, done) qui dessine la question dans `el`
 * puis appelle done({ correct, answer }) une seule fois quand l'enfant a répondu.
 * `answer` (HTML court) est affiché comme correction en cas d'erreur.
 *
 * Types : choice, fill, errors, sort, match (voir .claude/skills/generate-exercise).
 */
(function () {
  'use strict';
  const R = window.ReviFun;
  const { esc, shuffle, normalize } = R;

  const BLANK = '___';
  const ACCENTS = ['à', 'â', 'é', 'è', 'ê', 'ë', 'î', 'ï', 'ô', 'ù', 'û', 'ç', "'"];

  function header(q, fallback) {
    const say = q.say && R.fx.canSpeak
      ? `<button class="say-btn" type="button" aria-label="Écouter la phrase">🔊</button>` : '';
    return `<div class="q-prompt">${esc(q.prompt || fallback)}${say}</div>`;
  }

  function bindSay(q, el) {
    const b = el.querySelector('.say-btn');
    if (b) b.addEventListener('click', () => R.fx.speak(q.say));
  }

  // Remplace chaque ___ du texte par le HTML renvoyé par makeBlank(index).
  function withBlanks(text, makeBlank) {
    return text.split(BLANK).map((part, i, all) =>
      esc(part) + (i < all.length - 1 ? makeBlank(i) : '')).join('');
  }

  function blankCount(text) {
    return text ? text.split(BLANK).length - 1 : 0;
  }

  /* ---------- Choix multiple (2 à 4 boutons) ---------- */

  function choice(q, el, done) {
    const order = q.options.length > 2 ? shuffle(q.options.map((_, i) => i)) : q.options.map((_, i) => i);
    el.innerHTML = `
      ${header(q, 'Choisis la bonne réponse')}
      ${q.text ? `<div class="q-sentence">${withBlanks(q.text, i => `<span class="blank" data-b="${i}">?</span>`)}</div>` : ''}
      <div class="choices n${q.options.length} ${q.options.some(o => o.length > 14) ? 'long' : ''}">
        ${order.map(i => `<button class="choice" type="button" data-i="${i}">${esc(q.options[i])}</button>`).join('')}
      </div>`;
    bindSay(q, el);
    const buttons = [...el.querySelectorAll('.choice')];
    buttons.forEach(btn => btn.addEventListener('click', () => {
      const chosen = q.options[+btn.dataset.i];
      const ok = chosen === q.answer;
      buttons.forEach(b => {
        b.disabled = true;
        if (q.options[+b.dataset.i] === q.answer) b.classList.add('good');
      });
      if (!ok) btn.classList.add('bad');
      // Remplit les trous avec la bonne réponse (« a / à » se répartit sur 2 trous).
      const blanks = [...el.querySelectorAll('.blank')];
      const parts = blanks.length > 1 ? q.answer.split(' / ') : [q.answer];
      blanks.forEach((b, i) => { b.textContent = parts[i] || q.answer; b.classList.add('filled'); });
      done({ correct: ok, answer: `<b>${esc(q.answer)}</b>` });
    }));
  }

  /* ---------- Texte à compléter (clavier) ---------- */

  function accepted(ans) { return Array.isArray(ans) ? ans : [ans]; }

  function fill(q, el, done) {
    el.innerHTML = `
      ${header(q, 'Complète la phrase')}
      <div class="q-sentence fill-sentence">${withBlanks(q.text, i => {
        const longest = Math.max(...accepted(q.answers[i]).map(a => a.length));
        const base = Math.max(4, longest + 3);
        return `<span class="fill-wrap"><input class="fill-input" data-i="${i}" data-base="${base}" type="text"
          autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
          enterkeyhint="done" inputmode="text" name="r${Math.random().toString(36).slice(2)}"
          aria-label="Réponse ${i + 1}" style="width:${base}ch"></span>`;
      })}</div>
      <div class="accents" aria-label="Lettres accentuées">
        ${ACCENTS.map(a => `<button type="button" class="accent" tabindex="-1">${a}</button>`).join('')}
      </div>
      <button class="btn primary validate" type="button" disabled>Valider</button>`;
    bindSay(q, el);
    const inputs = [...el.querySelectorAll('.fill-input')];
    const validate = el.querySelector('.validate');
    let last = inputs[0];
    const refresh = () => {
      validate.disabled = inputs.some(i => !i.value.trim());
      // Le champ s'élargit si l'enfant tape plus long que prévu : tout reste visible.
      inputs.forEach(i => { i.style.width = Math.max(+i.dataset.base, i.value.length + 2) + 'ch'; });
    };
    inputs.forEach((inp, idx) => {
      inp.addEventListener('focus', () => { last = inp; });
      inp.addEventListener('input', refresh);
      inp.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (idx < inputs.length - 1) inputs[idx + 1].focus();
        else if (!validate.disabled) validate.click();
      });
    });
    el.querySelectorAll('.accent').forEach(b => {
      // mousedown + preventDefault : le champ garde le focus (pas de clavier qui saute).
      b.addEventListener('mousedown', e => e.preventDefault());
      b.addEventListener('click', () => {
        if (!last || last.readOnly) return;
        const s = last.selectionStart ?? last.value.length;
        const e2 = last.selectionEnd ?? last.value.length;
        last.value = last.value.slice(0, s) + b.textContent + last.value.slice(e2);
        last.focus();
        last.setSelectionRange(s + 1, s + 1);
        refresh();
      });
    });
    validate.addEventListener('click', () => {
      let allOk = true;
      inputs.forEach((inp, i) => {
        const list = accepted(q.answers[i]);
        const ok = list.some(a => normalize(a) === normalize(inp.value));
        inp.readOnly = true;
        inp.classList.add(ok ? 'good' : 'bad');
        if (!ok) {
          allOk = false;
          inp.insertAdjacentHTML('afterend', `<span class="fix">${esc(list[0])}</span>`);
        }
      });
      validate.remove();
      el.querySelector('.accents').remove();
      if (document.activeElement) document.activeElement.blur();
      done({ correct: allOk, answer: q.answers.map(a => `<b>${esc(accepted(a)[0])}</b>`).join(', ') });
    });
    setTimeout(() => { if (window.matchMedia('(pointer: fine)').matches) inputs[0].focus(); }, 50);
  }

  /* ---------- Chasse aux fautes ---------- */

  // « Il [et|est] content. » → mots ; [faux|juste] marque une faute.
  function parseErrors(text) {
    const tokens = [];
    const re = /\[([^\]|]+)\|([^\]]+)\]|[^\s[]+/g;
    let m;
    while ((m = re.exec(text))) {
      if (m[1] !== undefined) tokens.push({ word: m[1], fix: m[2] });
      else tokens.push({ word: m[0] });
    }
    return tokens;
  }

  function errors(q, el, done) {
    const tokens = parseErrors(q.text);
    const n = tokens.filter(t => t.fix).length;
    const s = n > 1 ? 's' : '';
    el.innerHTML = `
      ${header(q, `Touche ${n === 1 ? 'le mot mal écrit' : `les ${n} mots mal écrits`}`)}
      <div class="q-sentence words">${tokens.map((t, i) => /^[.,;:!?…»«]+$/.test(t.word)
        ? `<span class="punct">${esc(t.word)}</span>`
        : `<button type="button" class="word" data-i="${i}">${esc(t.word)}</button>`).join(' ')}</div>
      <div class="hunt-count">🔍 <span class="found">0</span> / ${n} faute${s} sélectionnée${s}</div>
      <button class="btn primary validate" type="button" disabled>Valider</button>`;
    bindSay(q, el);
    const words = [...el.querySelectorAll('.word')];
    const validate = el.querySelector('.validate');
    const count = el.querySelector('.found');
    const selected = new Set();
    words.forEach(w => w.addEventListener('click', () => {
      const i = +w.dataset.i;
      if (selected.has(i)) selected.delete(i);
      else if (selected.size < n) selected.add(i);
      else { w.classList.add('shake'); setTimeout(() => w.classList.remove('shake'), 400); return; }
      w.classList.toggle('picked', selected.has(i));
      count.textContent = selected.size;
      validate.disabled = selected.size !== n;
      R.fx.play('tap');
    }));
    validate.addEventListener('click', () => {
      let ok = true;
      words.forEach(w => {
        const t = tokens[+w.dataset.i];
        const picked = selected.has(+w.dataset.i);
        w.disabled = true;
        w.classList.remove('picked');
        if (t.fix) {
          w.classList.add(picked ? 'good' : 'missed');
          w.innerHTML = `<s>${esc(t.word)}</s> ${esc(t.fix)}`;
          if (!picked) ok = false;
        } else if (picked) {
          w.classList.add('bad');
          ok = false;
        }
      });
      validate.remove();
      el.querySelector('.hunt-count').remove();
      done({ correct: ok, answer: tokens.filter(t => t.fix).map(t => `<s>${esc(t.word)}</s> → <b>${esc(t.fix)}</b>`).join(', ') });
    });
  }

  /* ---------- Tri dans des paniers ---------- */

  function sort(q, el, done) {
    const cards = shuffle(q.items);
    // `fills` (optionnel) : ce qu'on écrit dans le trou si l'étiquette du panier diffère (« -é » → « é »).
    const bucketText = (card) => card.t.includes(BLANK)
      ? card.t.replace(BLANK, (q.fills || q.buckets)[card.b]) : card.t;
    let idx = 0;
    const results = [];
    el.innerHTML = `
      ${header(q, 'Range chaque carte dans le bon panier')}
      <div class="sort-zone">
        <div class="sort-count">1 / ${cards.length}</div>
        <div class="sort-stage"><div class="sort-card"></div></div>
        <div class="buckets n${q.buckets.length}">
          ${q.buckets.map((b, i) => `<button type="button" class="bucket" data-b="${i}"><span class="basket">🧺</span>${esc(b)}</button>`).join('')}
        </div>
      </div>`;
    bindSay(q, el);
    const card = el.querySelector('.sort-card');
    const counter = el.querySelector('.sort-count');
    const buckets = [...el.querySelectorAll('.bucket')];
    let busy = false;

    function show() {
      card.className = 'sort-card enter';
      card.innerHTML = withBlanks(cards[idx].t, () => '<span class="blank">?</span>');
      counter.textContent = `${idx + 1} / ${cards.length}`;
    }

    buckets.forEach(btn => btn.addEventListener('click', () => {
      if (busy) return;
      busy = true;
      const b = +btn.dataset.b;
      const c = cards[idx];
      const ok = b === c.b;
      results.push({ card: c, ok });
      card.innerHTML = esc(bucketText(c));
      if (ok) {
        R.fx.play('tap');
        btn.classList.add('flash-good');
        card.classList.add(b < q.buckets.length / 2 ? 'fly-left' : 'fly-right');
      } else {
        R.fx.play('bad');
        card.classList.add('wrong');
        buckets[c.b].classList.add('flash-good');
      }
      setTimeout(() => {
        buckets.forEach(x => x.classList.remove('flash-good'));
        busy = false;
        idx++;
        if (idx < cards.length) show();
        else finish();
      }, ok ? 420 : 1100);
    }));

    function finish() {
      const good = results.filter(r => r.ok).length;
      el.querySelector('.sort-zone').innerHTML = `
        <div class="sort-summary">${results.map(r => `
          <div class="sort-line ${r.ok ? 'ok' : 'ko'}">${r.ok ? '✅' : '❌'} ${esc(bucketText(r.card))}
          <span class="tag">${esc(q.buckets[r.card.b])}</span></div>`).join('')}
        </div>`;
      // Une seule étourderie est tolérée à partir de 5 cartes.
      const allowed = results.length >= 5 ? 1 : 0;
      done({ correct: good >= results.length - allowed, answer: `${good} / ${results.length} cartes bien rangées` });
    }

    show();
  }

  /* ---------- Relier les paires ---------- */

  function match(q, el, done) {
    const right = shuffle(q.pairs.map((p, i) => i));
    el.innerHTML = `
      ${header(q, 'Relie chaque élément à son partenaire')}
      <div class="match">
        <div class="col">${q.pairs.map((p, i) => `<button type="button" class="m-item" data-side="l" data-i="${i}">${esc(p[0])}</button>`).join('')}</div>
        <div class="col">${right.map(i => `<button type="button" class="m-item" data-side="r" data-i="${i}">${esc(q.pairs[i][1])}</button>`).join('')}</div>
      </div>`;
    bindSay(q, el);
    let sel = null;
    let mistakes = 0;
    let paired = 0;
    const all = [...el.querySelectorAll('.m-item')];
    all.forEach(btn => btn.addEventListener('click', () => {
      if (btn.classList.contains('paired')) return;
      if (!sel || sel.dataset.side === btn.dataset.side) {
        if (sel) sel.classList.remove('sel');
        sel = btn;
        btn.classList.add('sel');
        R.fx.play('tap');
        return;
      }
      if (sel.dataset.i === btn.dataset.i) {
        paired++;
        [sel, btn].forEach(b => { b.classList.remove('sel'); b.classList.add('paired', `c${paired % 6}`); b.disabled = true; });
        R.fx.play('tap');
        sel = null;
        if (paired === q.pairs.length) {
          done({ correct: mistakes === 0, answer: mistakes ? `${mistakes} erreur${mistakes > 1 ? 's' : ''} en reliant` : '' });
        }
      } else {
        mistakes++;
        R.fx.play('bad');
        const pair = [sel, btn];
        pair.forEach(b => b.classList.add('shake', 'wrong'));
        setTimeout(() => pair.forEach(b => b.classList.remove('shake', 'wrong', 'sel')), 450);
        sel = null;
      }
    }));
  }

  R.questions = { choice, fill, errors, sort, match, parseErrors, blankCount, BLANK };
})();

</script>
<script>/* js/lesson.js */
/* Mochi & les Mots — déroulé d'une leçon : fiche → 10 questions → résultats. */
(function () {
  'use strict';
  const R = window.ReviFun;
  const { esc, shuffle, pick } = R;

  const PER_SESSION = 10;
  const REST_DAYS = 2;   // une leçon réussie en entier revient à J+2

  // Barème volontairement serré : une partie sans faute rapporte ~50 🐟, une partie moyenne ~20 🐟.
  const REWARD = {
    perAnswer: 2,      // 🐟 par bonne réponse
    combo: 1,          // bonus par bonne réponse à partir de 3 d'affilée
    comboFrom: 3,
    perfect: 10,       // partie complète sans faute (jamais en rattrapage)
    firstThreeStars: 10,
    daily: 5,          // première partie du jour
  };

  // Messages après une bonne réponse — vocabulaire de cour de récré (6e).
  const PRAISE = [
    'Trop fort !', 'Stylé !', 'T\'es un boss !', 'GG !', 'Validé ✅', 'Ça passe crème !',
    'Énorme !', 'La classe !', 'Masterclass !', 'T\'as géré !', 'Trop chaud !', 'C\'est carré !',
    'Incroyable !', 'Tranquille 😎', 'Respect !', 'Une dinguerie !', 'Le roi du français !',
    'Bien joué !', 'Ça, c\'est fait !', 'Pas mal du tout !', 'Imbattable !', 'Trop facile pour toi !',
    'Mochi est fier de toi !', 'Miaou-gnifique !', 'Pattes de velours !', 'Tu régales !',
  ];
  const COMBO_PRAISE = [
    'Tu es en feu 🔥', 'Série de malade !', 'Rien ne t\'arrête !', 'Inarrêtable !', 'Mode légende activé !',
  ];
  const OOPS = [
    'Oups, presque !', 'Pas grave, on apprend !', 'Raté… mais tu vas l\'avoir !', 'Aïe, piège !',
    'Même les boss se trompent !', 'Mochi aussi s\'est trompé au début !',
  ];

  // Omikuji : papier de bonne fortune tiré après une partie à 8/10 ou plus.
  const OMIKUJI = [
    { rank: '大吉 Grande chance !', fish: 10, weight: 1, fortunes: ['Une sieste de 3 heures t\'attend.', 'Tu trouveras une frite au fond du sachet.', 'Ton prof oubliera de donner des devoirs.'] },
    { rank: '中吉 Belle chance', fish: 5, weight: 3, fortunes: ['Un chat va te regarder avec respect.', 'Ta prochaine dictée sera trop stylée.', 'La cantine servira ton plat préféré.'] },
    { rank: '小吉 Petite chance', fish: 3, weight: 4, fortunes: ['Tu ne te tromperas plus entre a et à.', 'Un arc-en-ciel apparaîtra (peut-être).', 'Ton crayon ne cassera pas de la journée.'] },
    { rank: '吉 Chance', fish: 2, weight: 4, fortunes: ['Mochi pense très fort à toi.', 'Quelqu\'un va te faire rire aujourd\'hui.', 'Tes chaussettes seront assorties.'] },
  ];

  function drawOmikuji() {
    const total = OMIKUJI.reduce((s, o) => s + o.weight, 0);
    let r = Math.random() * total;
    const o = OMIKUJI.find(x => (r -= x.weight) < 0) || OMIKUJI[OMIKUJI.length - 1];
    return { rank: o.rank, fish: o.fish, text: pick(o.fortunes) };
  }

  let ui = null;     // callbacks de app.js (navigation)
  let state = null;  // session en cours

  function init(callbacks) { ui = callbacks; }

  function qHash(q) { return R.hash(JSON.stringify(q)); }

  /* ---------- Où en est une leçon ? ---------- */

  // kind : 'new' (jamais faite) | 'ready' (partie complète possible)
  //      | 'retry' (des erreurs à corriger tout de suite) | 'rest' (réussie, revient à J+2)
  function status(ex) {
    const rec = R.peekLesson(ex.id);
    const known = ex.questions.map(qHash);
    const pending = (rec.pending || []).filter(h => known.includes(h));
    if (pending.length) return { kind: 'retry', pending };
    if (rec.doneDay) {
      const back = R.addDays(rec.doneDay, REST_DAYS);
      if (R.today() < back) return { kind: 'rest', back };
    }
    return { kind: rec.attempts ? 'ready' : 'new' };
  }

  function goLabel(ex, st) {
    if (st.kind === 'retry') return `🔁 Corriger ${st.pending.length === 1 ? 'mon erreur' : `mes ${st.pending.length} erreurs`}`;
    return `C'est parti ! ${Math.min(PER_SESSION, ex.questions.length)} questions 🚀`;
  }

  /* ---------- Fiche de cours ---------- */

  function showSheet(id) {
    const ex = R.getExercise(id);
    if (!ex) return;
    document.body.classList.add('in-lesson');
    const rec = R.peekLesson(id);
    const st = status(ex);
    const go = st.kind === 'rest'
      ? `<div class="rest-note">😴 Leçon réussie en entier ! Elle revient <b>${esc(R.dayLabel(st.back))}</b>.<br>En attendant, relis la fiche ou essaie une autre leçon.</div>`
      : `${st.kind === 'retry' ? `<div class="muted">Tu refais seulement les questions ratées la dernière fois (pas de bonus « sans faute » en rattrapage).</div>` : ''}
         <button class="btn primary big go" type="button">${goLabel(ex, st)}</button>`;
    ui.render(`
      <div class="lesson-screen" style="--theme:${ex.color || '#f28482'}">
        <div class="lesson-top">
          <button class="icon-btn back" type="button" aria-label="Retour">←</button>
          <div class="lesson-title"><span class="emoji">${ex.emoji}</span> ${esc(ex.title)}</div>
        </div>
        <div class="sheet">
          <div class="sheet-hero">
            ${R.cat.catSVG('happy', 86)}
            <div class="bubble">${ex.sheet.intro}</div>
          </div>
          ${ex.sheet.cards.map((c, i) => `
            <section class="sheet-card" style="animation-delay:${i * 0.08}s">
              <h3><span class="emoji">${c.emoji || '📌'}</span> ${esc(c.title)}</h3>
              <div class="sheet-body">${c.html}</div>
            </section>`).join('')}
          ${ex.sheet.trick ? `<section class="sheet-card trick"><h3>🐾 L'astuce de ${esc(R.save.catName)}</h3><div class="sheet-body">${ex.sheet.trick}</div></section>` : ''}
          <div class="sheet-go">
            ${rec.attempts ? `<div class="muted">Meilleur score : ${rec.best}/10 · ${starsText(rec.stars)}</div>` : ''}
            ${go}
          </div>
        </div>
      </div>`);
    document.querySelector('.back').addEventListener('click', () => { document.body.classList.remove('in-lesson'); ui.go('lessons'); });
    const goBtn = document.querySelector('.go');
    if (goBtn) goBtn.addEventListener('click', () => startQuiz(id));
    window.scrollTo(0, 0);
  }

  function starsText(n) {
    return '★'.repeat(n) + '☆'.repeat(3 - n);
  }

  /* ---------- Quiz ---------- */

  // Partie complète : jusqu'à 3 questions déjà ratées dans une partie précédente, le reste au hasard.
  // Rattrapage : uniquement les questions ratées à la dernière partie.
  function drawQuestions(ex, st) {
    const pool = ex.questions.map(q => ({ q, h: qHash(q) }));
    if (st.kind === 'retry') return shuffle(pool.filter(p => st.pending.includes(p.h)));
    const missed = R.peekLesson(ex.id).missed || [];
    const again = shuffle(pool.filter(p => missed.includes(p.h))).slice(0, 3);
    const rest = shuffle(pool.filter(p => !again.includes(p))).slice(0, PER_SESSION - again.length);
    return shuffle(again.concat(rest));
  }

  function startQuiz(id) {
    const ex = R.getExercise(id);
    const st = status(ex);
    if (st.kind === 'rest') { showSheet(id); return; }
    document.body.classList.add('in-lesson');
    state = {
      ex,
      retry: st.kind === 'retry',
      list: drawQuestions(ex, st),
      i: 0,
      results: [],
      combo: 0,
      bestCombo: 0,
      fish: 0,
      comboFish: 0,
    };
    ui.render(`
      <div class="lesson-screen quiz" style="--theme:${ex.color || '#f28482'}">
        <div class="quiz-top">
          <button class="icon-btn quit" type="button" aria-label="Quitter">✕</button>
          <div class="paws">${state.list.map(() => '<span class="paw"></span>').join('')}</div>
          <div class="quiz-fish">🐟 <span class="qf">0</span></div>
        </div>
        <div class="quit-confirm" hidden>
          Quitter la leçon ? Les poissons de cette partie seront perdus.
          <div class="row"><button class="btn small danger yes" type="button">Quitter</button><button class="btn small no" type="button">Continuer</button></div>
        </div>
        <div class="combo-badge" hidden></div>
        <div class="q-card"></div>
        <div class="feedback" hidden></div>
      </div>`);
    const confirm = document.querySelector('.quit-confirm');
    document.querySelector('.quit').addEventListener('click', () => { confirm.hidden = !confirm.hidden; });
    confirm.querySelector('.no').addEventListener('click', () => { confirm.hidden = true; });
    confirm.querySelector('.yes').addEventListener('click', () => {
      state = null;
      document.body.classList.remove('in-lesson');
      ui.go('lessons');
    });
    nextQuestion();
  }

  function nextQuestion() {
    const card = document.querySelector('.q-card');
    const fb = document.querySelector('.feedback');
    fb.hidden = true;
    fb.className = 'feedback';
    const { q } = state.list[state.i];
    document.querySelectorAll('.paw').forEach((p, i) => p.classList.toggle('current', i === state.i));
    card.className = `q-card type-${q.type}`;
    card.innerHTML = '<div class="q-num"></div><div class="q-body"></div>';
    card.querySelector('.q-num').textContent = `Question ${state.i + 1} / ${state.list.length}`;
    const render = R.questions[q.type];
    let answered = false;
    render(q, card.querySelector('.q-body'), res => {
      if (answered) return;
      answered = true;
      onAnswer(res);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function onAnswer(res) {
    const { q } = state.list[state.i];
    state.results.push({ ...state.list[state.i], correct: res.correct, answer: res.answer });
    const paw = document.querySelectorAll('.paw')[state.i];
    paw.classList.remove('current');
    paw.classList.add(res.correct ? 'ok' : 'ko');

    let title;
    let gain = 0;
    if (res.correct) {
      state.combo++;
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      gain = REWARD.perAnswer;
      // Pas de bonus combo en rattrapage : on ne fait que corriger ses erreurs.
      if (state.combo >= REWARD.comboFrom && !state.retry) {
        gain += REWARD.combo;
        state.comboFish += REWARD.combo;
      }
      state.fish += gain;
      title = state.combo >= REWARD.comboFrom && state.combo % 3 === 0 ? pick(COMBO_PRAISE) : pick(PRAISE);
      R.fx.play('good');
    } else {
      state.combo = 0;
      title = pick(OOPS);
      R.fx.play('bad');
    }

    const counter = document.querySelector('.qf');
    counter.textContent = state.fish;
    if (gain) R.fx.floatText(counter, `+${gain} 🐟`);

    const badge = document.querySelector('.combo-badge');
    badge.hidden = state.combo < REWARD.comboFrom || state.retry;
    badge.textContent = `🔥 Combo x${state.combo} · +${REWARD.combo} 🐟 bonus`;

    const fb = document.querySelector('.feedback');
    const last = state.i === state.list.length - 1;
    fb.className = `feedback ${res.correct ? 'good' : 'bad'}`;
    fb.innerHTML = `
      <div class="fb-head">
        ${R.cat.catSVG(res.correct ? 'happy' : 'sad', 58)}
        <div class="fb-title">${esc(title)}</div>
      </div>
      ${!res.correct && res.answer ? `<div class="fb-answer">Réponse : ${res.answer}</div>` : ''}
      ${q.explain ? `<div class="fb-explain">💡 ${esc(q.explain)}</div>` : ''}
      <button class="btn primary next" type="button">${last ? 'Voir mon score 🏁' : 'Continuer →'}</button>`;
    fb.hidden = false;
    const next = fb.querySelector('.next');
    next.addEventListener('click', () => {
      state.i++;
      if (state.i < state.list.length) nextQuestion();
      else finish();
    });
    setTimeout(() => {
      next.focus({ preventScroll: true });
      fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 60);
  }

  /* ---------- Résultats & récompenses ---------- */

  function finish() {
    const s = R.save;
    const { ex, results, retry } = state;
    const score = results.filter(r => r.correct).length;
    const total = results.length;
    const allRight = score === total;
    // Les étoiles ne se gagnent qu'en partie complète.
    const stars = retry ? 0 : allRight ? 3 : score >= 8 ? 2 : score >= 5 ? 1 : 0;
    const rec = R.lessonRecord(ex.id);
    const prevStars = rec.stars;

    const rewards = [{ label: `${score} bonne${score > 1 ? 's' : ''} réponse${score > 1 ? 's' : ''}`, fish: score * REWARD.perAnswer }];
    if (state.comboFish) rewards.push({ label: `Bonus combo (record : ${state.bestCombo})`, fish: state.comboFish });
    if (!retry && allRight) rewards.push({ label: 'Partie parfaite !', fish: REWARD.perfect });
    if (stars === 3 && prevStars < 3) rewards.push({ label: 'Première fois 3 étoiles', fish: REWARD.firstThreeStars });

    const today = R.today();
    if (s.streak.last !== today) {
      s.streak.days = s.streak.last === R.yesterday() ? s.streak.days + 1 : 1;
      s.streak.last = today;
      s.streak.best = Math.max(s.streak.best, s.streak.days);
      rewards.push({ label: `Défi du jour (série : ${s.streak.days} jour${s.streak.days > 1 ? 's' : ''} 🔥)`, fish: REWARD.daily });
    }
    const totalFish = rewards.reduce((a, r) => a + r.fish, 0);

    // Mise à jour de la sauvegarde
    rec.attempts++;
    rec.last = today;
    const wrong = results.filter(r => !r.correct).map(r => r.h);
    const right = results.filter(r => r.correct).map(r => r.h);
    if (!retry) {
      rec.best = Math.max(rec.best, score);
      rec.stars = Math.max(rec.stars, stars);
      if (allRight) rec.perfects++;
      rec.missed = Array.from(new Set(rec.missed.filter(h => !right.includes(h)).concat(wrong)));
    }
    // Les erreurs restantes sont à corriger en rattrapage ; sans erreur, la leçon se repose jusqu'à J+2.
    rec.pending = wrong;
    rec.doneDay = wrong.length ? null : today;
    const back = R.addDays(today, REST_DAYS);
    s.fish += totalFish;
    s.fishEarned += totalFish;
    s.sessions++;
    if (!retry && allRight) s.perfectSessions++;
    s.bestCombo = Math.max(s.bestCombo, state.bestCombo);
    const newTrophies = ui.checkTrophies();
    R.persist();

    const verdict = retry
      ? (allRight ? 'Rattrapage réussi, toutes tes erreurs sont corrigées ! ✅'
        : `Encore ${wrong.length} question${wrong.length > 1 ? 's' : ''} à corriger. Tu peux réessayer tout de suite !`)
      : allRight ? 'SANS FAUTE ! Tu es une légende 🏆'
        : score >= 8 ? 'Excellent travail, presque parfait !'
          : score >= 5 ? 'Bien joué ! Corrige tes erreurs pour valider la leçon.'
            : 'Courage ! Relis la fiche, puis corrige tes erreurs.';
    const next = wrong.length
      ? `Tu peux refaire tout de suite les ${wrong.length === 1 ? 'question ratée' : `${wrong.length} questions ratées`}.`
      : `Leçon validée ! Tu pourras la refaire en entier ${R.dayLabel(back)}.`;
    const affordable = R.items.filter(it => !s.owned.includes(it.id) && it.price <= s.fish && ui.itemUnlocked(it)).length;

    ui.render(`
      <div class="lesson-screen results" style="--theme:${ex.color || '#f28482'}">
        <div class="result-card">
          <div class="result-cat">${R.cat.catSVG(score >= 8 ? 'happy' : score >= 5 ? 'normal' : 'sad', 110)}</div>
          ${retry ? '<div class="result-tag">🔁 Rattrapage</div>' : ''}
          <div class="result-score">${score}<small>/${total}</small></div>
          ${retry ? '' : `<div class="result-stars">${[0, 1, 2].map(i => `<span class="star ${i < stars ? 'on' : ''}" style="animation-delay:${0.3 + i * 0.35}s">★</span>`).join('')}</div>`}
          <div class="result-verdict">${esc(verdict)}</div>
          <div class="result-next">${wrong.length ? '🔁' : '😴'} ${esc(next)}</div>
          <div class="rewards">
            ${rewards.map(r => `<div class="reward-line"><span>${esc(r.label)}</span><b>+${r.fish} 🐟</b></div>`).join('')}
            <div class="reward-line total"><span>Total gagné</span><b>+${totalFish} 🐟</b></div>
          </div>
          ${newTrophies.map(t => `<div class="new-trophy">🏆 Nouveau trophée : <b>${esc(t.name)}</b></div>`).join('')}
          ${!retry && score >= 8 ? `<div class="omikuji">
            <button class="btn omikuji-btn" type="button"><span class="box">🎋</span> Tirer un omikuji (papier de chance)</button>
          </div>` : ''}
          ${affordable ? `<div class="shop-hint">🛍️ Tu as ${s.fish} 🐟 : ${affordable} objet${affordable > 1 ? 's' : ''} t'attend${affordable > 1 ? 'ent' : ''} à la boutique !</div>` : ''}
        </div>
        ${results.some(r => !r.correct) ? `
        <details class="review">
          <summary>📝 Revoir mes erreurs (${results.filter(r => !r.correct).length})</summary>
          ${results.filter(r => !r.correct).map(r => `
            <div class="review-item">
              <div class="review-q">${esc(questionLabel(r.q))}</div>
              ${r.answer ? `<div>✔️ ${r.answer}</div>` : ''}
              ${r.q.explain ? `<div class="muted">💡 ${esc(r.q.explain)}</div>` : ''}
            </div>`).join('')}
        </details>` : ''}
        <div class="result-actions">
          ${wrong.length ? `<button class="btn primary big again" type="button">${goLabel(ex, { kind: 'retry', pending: wrong })}</button>` : ''}
          <button class="btn sheet-btn" type="button">📖 Relire la fiche</button>
          <button class="btn home ${wrong.length ? '' : 'primary'}" type="button">${affordable ? '🛍️ Boutique' : '🏠 Ma maison'}</button>
        </div>
      </div>`);

    const omi = document.querySelector('.omikuji-btn');
    if (omi) omi.addEventListener('click', () => {
      omi.disabled = true;
      omi.classList.add('shaking');
      R.fx.play('tap');
      setTimeout(() => {
        const o = drawOmikuji();
        s.fish += o.fish;
        s.fishEarned += o.fish;
        R.persist();
        R.fx.play('coin');
        omi.parentElement.innerHTML = `
          <div class="omikuji-paper">
            <div class="omi-rank">${esc(o.rank)}</div>
            <div class="omi-text">« ${esc(o.text)} »</div>
            <div class="omi-fish">+${o.fish} 🐟</div>
          </div>`;
      }, 900);
    });

    const again = document.querySelector('.again');
    if (again) again.addEventListener('click', () => startQuiz(ex.id));
    document.querySelector('.sheet-btn').addEventListener('click', () => showSheet(ex.id));
    document.querySelector('.home').addEventListener('click', () => {
      document.body.classList.remove('in-lesson');
      ui.go(affordable ? 'shop' : 'house');
    });
    setTimeout(() => {
      for (let i = 0; i < stars; i++) setTimeout(() => R.fx.play('star'), 300 + i * 350);
      if (allRight) { R.fx.play('win'); R.fx.sakura(retry ? 50 : 140); }
      else if (stars >= 2) R.fx.sakura(50);
    }, 100);
    state = null;
    window.scrollTo(0, 0);
  }

  function questionLabel(q) {
    if (q.text) return q.type === 'errors' ? q.text.replace(/\[([^\]|]+)\|[^\]]+\]/g, '$1') : q.text;
    return q.prompt || '';
  }

  R.lesson = {
    init, showSheet, startQuiz, status, REWARD, PER_SESSION, REST_DAYS,
    // Utilisé par les tests automatiques (tools/smoke.mjs).
    currentQuestion: () => (state && state.list[state.i] ? state.list[state.i].q : null),
  };
})();

</script>

(function () {
  // Étoile à 5 branches centrée en (cx, cy).
  function star(cx, cy, r) {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 ? r * 0.45 : r;
      pts.push(`${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`);
    }
    return `M${pts.join(' L')} Z`;
  }

  // Point et tangente sur une courbe de Bézier cubique.
  function bezier([p0, p1, p2, p3], t) {
    const u = 1 - t;
    const pt = k => u * u * u * p0[k] + 3 * u * u * t * p1[k] + 3 * u * t * t * p2[k] + t * t * t * p3[k];
    const d = k => 3 * u * u * (p1[k] - p0[k]) + 6 * u * t * (p2[k] - p1[k]) + 3 * t * t * (p3[k] - p2[k]);
    const len = Math.hypot(d(0), d(1)) || 1;
    return { x: pt(0), y: pt(1), tx: d(0) / len, ty: d(1) / len };
  }
