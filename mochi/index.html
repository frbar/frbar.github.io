<script>/* js/app.js */
/* Mochi & les Mots — application : onglets Maison / Leçons / Boutique / Moi. */
(function () {
  'use strict';
  const R = window.ReviFun;
  const { esc, pick } = R;

  const app = document.getElementById('app');
  let tab = 'house';
  let room = 'salon';
  let catSpot = 0;
  let shopRoom = 'salon';
  let editing = false;    // mode « déplacer les objets » (baguette magique)
  let selected = null;    // objet sélectionné en mode déplacement

  const WAND = 'baguette';

  function render(html) { app.innerHTML = html; }

  function go(name) {
    tab = name;
    editing = false;
    selected = null;
    document.body.classList.remove('in-lesson');
    document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    ({ house: renderHouse, lessons: renderLessons, shop: renderShop, me: renderMe })[name]();
    window.scrollTo(0, 0);
  }

  function statsBar() {
    const s = R.save;
    return `
      <div class="stats">
        <div class="stat" title="Poissons">🐟 <b>${s.fish}</b></div>
        <div class="stat" title="Étoiles">⭐ <b>${R.totalStars()}</b><small>/${R.maxStars()}</small></div>
        <div class="stat" title="Jours d'affilée">🔥 <b>${s.streak.last === R.today() || s.streak.last === R.yesterday() ? s.streak.days : 0}</b></div>
      </div>`;
  }

  /* ---------- Trophées ---------- */

  const TROPHIES = [
    { id: 'first', emoji: '🎒', name: 'Premier pas', desc: 'Terminer une première leçon', test: s => s.sessions >= 1 },
    { id: 'perfect', emoji: '💯', name: 'Sans faute', desc: 'Faire une session parfaite (10/10)', test: s => s.perfectSessions >= 1 },
    { id: 'combo5', emoji: '🔥', name: 'En feu', desc: '5 bonnes réponses d\'affilée', test: s => s.bestCombo >= 5 },
    { id: 'combo10', emoji: '☄️', name: 'Comète', desc: '10 bonnes réponses d\'affilée', test: s => s.bestCombo >= 10 },
    { id: 'explorer', emoji: '🧭', name: 'Explorateur', desc: 'Essayer toutes les leçons', test: () => R.exercises.every(e => R.peekLesson(e.id).attempts > 0) },
    { id: 'stars10', emoji: '🌟', name: 'Collection d\'étoiles', desc: 'Gagner 10 étoiles', test: () => R.totalStars() >= 10 },
    { id: 'master', emoji: '👑', name: 'Maître des mots', desc: '3 étoiles partout', test: () => R.exercises.length > 0 && R.totalStars() === R.maxStars() },
    { id: 'streak3', emoji: '📅', name: 'Régulier', desc: 'Réviser 3 jours d\'affilée', test: s => s.streak.best >= 3 },
    { id: 'streak7', emoji: '🗓️', name: 'Champion de la semaine', desc: 'Réviser 7 jours d\'affilée', test: s => s.streak.best >= 7 },
    { id: 'decorator', emoji: '🛋️', name: 'Décorateur', desc: 'Avoir 5 objets', test: s => s.owned.length >= 5 },
    { id: 'garden', emoji: '🌸', name: 'Jardinier', desc: 'Installer un objet au jardin', test: s => s.owned.some(id => (R.getItem(id) || {}).room === 'jardin') },
    { id: 'rich', emoji: '🐠', name: 'Grand pêcheur', desc: 'Gagner 1000 poissons au total', test: s => s.fishEarned >= 1000 },
  ];

  function checkTrophies() {
    const s = R.save;
    const fresh = TROPHIES.filter(t => !s.trophies.includes(t.id) && t.test(s));
    fresh.forEach(t => s.trophies.push(t.id));
    return fresh;
  }

  function announceTrophies() {
    const fresh = checkTrophies();
    if (fresh.length) {
      R.persist();
      R.fx.toast(`🏆 Nouveau trophée : <b>${esc(fresh[0].name)}</b>`, 3000);
    }
  }

  /* ---------- Objets : conditions de déblocage ---------- */

  function itemUnlocked(it) {
    const s = R.save;
    if (it.requires && it.requires.stars && R.totalStars() < it.requires.stars) return false;
    if (it.requires && it.requires.item && !s.owned.includes(it.requires.item)) return false;
    if (!R.house.isRoomUnlocked(it.room)) return false;
    return true;
  }

  function lockReason(it) {
    const s = R.save;
    if (!R.house.isRoomUnlocked(it.room)) return `🔒 S'ouvre à ${R.house.ROOMS[it.room].unlock.owned} objets`;
    if (it.requires && it.requires.stars && R.totalStars() < it.requires.stars) return `🔒 ${it.requires.stars} ⭐ nécessaires`;
    if (it.requires && it.requires.item && !s.owned.includes(it.requires.item)) return `🔒 Il faut : ${esc(R.getItem(it.requires.item).name)}`;
    return '';
  }

  /* ---------- Maison ---------- */

  function catLine() {
    const s = R.save;
    const name = s.playerName ? esc(s.playerName) : 'toi';
    const affordable = R.items.filter(it => !s.owned.includes(it.id) && it.price <= s.fish && itemUnlocked(it));
    const neverPlayed = R.exercises.filter(e => !R.peekLesson(e.id).attempts);
    const toFix = R.exercises.filter(e => R.lesson.status(e).kind === 'retry');
    const lines = [];
    if (toFix.length) lines.push(`Il reste des erreurs à corriger dans « ${esc(toFix[0].title)} ». On s'y remet ?`);
    if (!s.owned.length) lines.push(`Ma maison est toute vide… On révise un peu pour gagner des 🐟 ?`);
    if (affordable.length) lines.push(`J'ai vu « ${esc(pick(affordable).name)} » à la boutique… On peut se l'offrir !`);
    if (neverPlayed.length) lines.push(`Tu n'as pas encore essayé « ${esc(neverPlayed[0].title)} ». On tente ?`);
    if (s.streak.last !== R.today()) lines.push(`Une petite leçon aujourd'hui ? Ça rapporte +${R.lesson.REWARD.daily} 🐟 bonus !`);
    lines.push(`Miaou ! Content de te voir, ${name} !`, `Tu savais ? « a » sans accent, c'est le verbe avoir. Moi j'ai faim !`,
      `Rrrrr… je ronronne de bonheur.`, `Un chat qui révise, c'est un chat qui réussit !`, `Touche-moi, j'adore les câlins !`);
    // Les phrases contextuelles (en tête de liste) sortent trois fois plus souvent.
    return pick(lines.slice(0, 3).concat(lines.slice(0, 3)).concat(lines));
  }

  function renderHouse() {
    if (!R.house.isRoomUnlocked(room)) room = 'salon';
    const spots = R.house.catSpots(room);
    if (catSpot >= spots.length) catSpot = 0;
    const rooms = Object.keys(R.house.ROOMS);
    const hasWand = R.save.owned.includes(WAND);
    if (!hasWand) editing = false;
    const sel = selected && R.getItem(selected);
    const bottom = editing ? `
      <div class="edit-bar">
        <div class="edit-help">🪄 <span class="edit-sel">${sel ? `<b>${esc(sel.name)}</b> : fais-le glisser !` : 'Touche un objet, puis fais-le glisser où tu veux.'}</span></div>
        <div class="edit-actions">
          <button class="btn small" type="button" data-act="front" ${sel ? '' : 'disabled'}>⬆️ Devant</button>
          <button class="btn small" type="button" data-act="back" ${sel ? '' : 'disabled'}>⬇️ Derrière</button>
          <button class="btn small" type="button" data-act="reset" ${sel ? '' : 'disabled'}>↩️ Place d'origine</button>
          <button class="btn small primary" type="button" data-act="done">✅ Terminé</button>
        </div>
      </div>` : `
      <div class="cat-talk"><b>${esc(R.save.catName)} :</b> <span class="line">${catLine()}</span></div>
      <div class="house-actions ${hasWand ? 'with-wand' : ''}">
        <button class="btn primary big" type="button" data-go="lessons">📚 Réviser et gagner des 🐟</button>
        <button class="btn" type="button" data-go="shop">🛍️ Boutique</button>
        ${hasWand ? '<button class="btn wand-btn" type="button" data-act="edit">🪄 Déplacer</button>' : ''}
      </div>`;
    render(`
      ${statsBar()}
      <div class="room-tabs">
        ${rooms.map(id => {
          const r = R.house.ROOMS[id];
          const open = R.house.isRoomUnlocked(id);
          return `<button type="button" class="chip ${id === room ? 'active' : ''}" data-room="${id}" ${open ? '' : 'disabled'}>
            ${r.emoji} ${esc(r.name)}${open ? '' : ` 🔒 ${R.save.owned.length}/${r.unlock.owned}`}</button>`;
        }).join('')}
      </div>
      <div class="scene-wrap ${editing ? 'editing' : ''}">${R.house.sceneSVG(room, catSpot)}</div>
      ${bottom}`);

    app.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => {
      room = b.dataset.room; catSpot = 0; selected = null; renderHouse();
    }));
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
    app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => editAction(b.dataset.act)));
    if (editing) bindEditing(); else bindScene();
  }

  /* ---------- Déplacer les objets (baguette magique) ---------- */

  function setPlacement(id, patch) {
    const pos = R.save.positions;
    pos[id] = Object.assign({}, pos[id], patch);
    R.persist();
  }

  function editAction(act) {
    if (act === 'edit') { editing = true; selected = null; R.fx.play('star'); renderHouse(); return; }
    if (act === 'done') { editing = false; selected = null; R.fx.toast('🪄 Ta maison est rangée !'); renderHouse(); return; }
    if (!selected) return;
    // Devant / derrière : on se place juste au-dessus ou en dessous des autres objets de la pièce.
    const zs = R.house.visibleItems(room).filter(it => it.id !== selected).map(it => R.house.placement(it).z);
    if (act === 'front') setPlacement(selected, { z: (zs.length ? Math.max(...zs) : 0) + 0.1 });
    if (act === 'back') setPlacement(selected, { z: (zs.length ? Math.min(...zs) : 0) - 0.1 });
    if (act === 'reset') { delete R.save.positions[selected]; R.persist(); }
    R.fx.play('tap');
    renderHouse();
  }

  function selectItem(id) {
    selected = id;
    app.querySelectorAll('.scene .item').forEach(g => g.classList.toggle('selected', g.dataset.item === id));
    app.querySelector('.edit-sel').innerHTML = `<b>${esc(R.getItem(id).name)}</b> : fais-le glisser !`;
    app.querySelectorAll('[data-act]').forEach(b => { b.disabled = false; });
  }

  // Glisser-déposer à la souris ou au doigt : on convertit la position du pointeur
  // en coordonnées de la scène (800 × 520), quelle que soit la taille de l'écran.
  function bindEditing() {
    const svg = app.querySelector('.scene');
    const toScene = e => {
      const pt = svg.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    };
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    let drag = null;
    svg.querySelectorAll('.item').forEach(g => {
      g.classList.toggle('selected', g.dataset.item === selected);
      g.addEventListener('pointerdown', e => {
        e.preventDefault();
        const it = R.getItem(g.dataset.item);
        selectItem(it.id);
        const p = R.house.placement(it);
        const start = toScene(e);
        drag = { g, it, offX: start.x - p.x, offY: start.y - p.y, x: p.x, y: p.y, moved: false };
        try { g.setPointerCapture(e.pointerId); } catch (_) { /* pointeur simulé */ }
        R.fx.play('tap');
      });
      g.addEventListener('pointermove', e => {
        if (!drag || drag.g !== g) return;
        const { it } = drag;
        const pt = toScene(e);
        const h = it.w * it.vb[1] / it.vb[0];
        // L'objet peut dépasser un peu du bord, mais jamais disparaître.
        drag.x = Math.round(clamp(pt.x - drag.offX, -it.w * 0.4, 800 - it.w * 0.6));
        drag.y = Math.round(clamp(pt.y - drag.offY, -h * 0.4, 520 - h * 0.6));
        drag.moved = true;
        g.setAttribute('transform', R.house.transformOf(it, drag.x, drag.y));
      });
      const end = () => {
        if (!drag || drag.g !== g) return;
        const d = drag;
        drag = null;
        if (d.moved) {
          setPlacement(d.it.id, { x: d.x, y: d.y });
          renderHouse();
        }
      };
      g.addEventListener('pointerup', end);
      g.addEventListener('pointercancel', end);
    });
  }

  function bindScene() {
    const cat = app.querySelector('.scene-cat');
    if (cat) {
      cat.addEventListener('click', () => {
        R.fx.play('meow');
        R.fx.hearts(cat);
        const spots = R.house.catSpots(room);
        if (spots.length > 1) {
          let next = catSpot;
          while (next === catSpot) next = Math.floor(Math.random() * spots.length);
          catSpot = next;
        }
        setTimeout(() => {
          app.querySelector('.scene-wrap').innerHTML = R.house.sceneSVG(room, catSpot, 'happy');
          app.querySelector('.cat-talk .line').innerHTML = catLine();
          bindScene();
        }, 450);
      });
    }
    app.querySelectorAll('.scene .item').forEach(g => g.addEventListener('click', () => {
      const it = R.getItem(g.dataset.item);
      g.classList.remove('wiggle');
      void g.getBoundingClientRect();
      g.classList.add('wiggle');
      R.fx.play('tap');
      R.fx.toast(`${esc(it.name)}`, 1200);
    }));
  }

  /* ---------- Leçons ---------- */

  function renderLessons() {
    render(`
      ${statsBar()}
      <h2 class="page-title">📚 Le chemin des leçons</h2>
      <p class="muted center">Une fiche à lire, puis 10 questions. Une erreur ? Corrige-la tout de suite.<br>Sans faute ? La leçon se repose 2 jours. Vise les 3 étoiles ⭐⭐⭐ !</p>
      <div class="path">
        ${R.exercises.map((ex, i) => {
          const rec = R.peekLesson(ex.id);
          const st = R.lesson.status(ex);
          const chapter = ex.chapter || 'Les bases';
          const prev = i ? (R.exercises[i - 1].chapter || 'Les bases') : null;
          const banner = chapter !== prev ? `<h3 class="chapter">${esc(chapter)}</h3>` : '<div class="path-dots"></div>';
          const state = st.kind === 'retry'
            ? `<span class="node-state retry">🔁 ${st.pending.length} erreur${st.pending.length > 1 ? 's' : ''} à corriger</span>`
            : st.kind === 'rest' ? `<span class="node-state rest">😴 Validée · revient ${esc(R.dayLabel(st.back))}</span>` : '';
          return `${banner}
          <button type="button" class="path-node ${i % 2 ? 'right' : 'left'} ${st.kind}" data-id="${esc(ex.id)}" style="--theme:${ex.color || '#f28482'}">
            <span class="node-icon">${ex.emoji}</span>
            <span class="node-text">
              <span class="node-title">${esc(ex.title)}</span>
              <span class="node-sub">${esc(ex.subtitle || '')}</span>
              <span class="node-stars">${'★'.repeat(rec.stars)}<span class="off">${'★'.repeat(3 - rec.stars)}</span>
                ${rec.best ? `<small>· record ${rec.best}/10</small>` : ''}</span>
              ${state}
            </span>
            ${st.kind === 'new' ? '<span class="new-tag">Nouveau !</span>' : ''}
          </button>`;
        }).join('')}
      </div>`);
    app.querySelectorAll('.path-node').forEach(b => b.addEventListener('click', () => R.lesson.showSheet(b.dataset.id)));
  }

  /* ---------- Boutique ---------- */

  function renderShop() {
    const s = R.save;
    const rooms = Object.keys(R.house.ROOMS);
    const list = R.items.filter(it => it.room === shopRoom).sort((a, b) => a.price - b.price);
    render(`
      ${statsBar()}
      <h2 class="page-title">🛍️ La boutique de Maître Neko</h2>
      <div class="room-tabs">
        ${rooms.map(id => `<button type="button" class="chip ${id === shopRoom ? 'active' : ''}" data-room="${id}">${R.house.ROOMS[id].emoji} ${esc(R.house.ROOMS[id].name)}</button>`).join('')}
      </div>
      <div class="shop-grid">
        ${list.map(it => {
          const owned = s.owned.includes(it.id);
          const stored = s.stored.includes(it.id);
          const unlocked = itemUnlocked(it);
          let action;
          if (owned) {
            action = `<button type="button" class="btn small toggle" data-id="${it.id}">${stored ? '📦 Installer' : '✓ Installé · ranger'}</button>`;
          } else if (!unlocked) {
            action = `<div class="lock">${lockReason(it)}</div>`;
          } else if (s.fish < it.price) {
            action = `<div class="lock">Il manque ${it.price - s.fish} 🐟</div>`;
          } else {
            action = `<button type="button" class="btn small primary buy" data-id="${it.id}">Acheter</button>`;
          }
          return `
          <div class="shop-card ${owned ? 'owned' : ''} ${!owned && (!unlocked || s.fish < it.price) ? 'dim' : ''}">
            <div class="thumb-wrap">${R.house.thumbSVG(it)}</div>
            <div class="shop-name">${esc(it.name)}</div>
            <div class="shop-desc">${esc(it.desc || '')}</div>
            <div class="shop-price">${owned ? '' : it.price ? `${it.price} 🐟` : '🎁 Cadeau'}</div>
            ${action}
          </div>`;
        }).join('')}
      </div>`);

    app.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => { shopRoom = b.dataset.room; renderShop(); }));
    app.querySelectorAll('.buy').forEach(b => {
      let armed = false;
      b.addEventListener('click', () => {
        // Achat en deux temps pour éviter les achats par erreur.
        if (!armed) {
          armed = true;
          b.textContent = 'Confirmer ✓';
          b.classList.add('armed');
          setTimeout(() => { if (b.isConnected) { armed = false; b.textContent = 'Acheter'; b.classList.remove('armed'); } }, 3000);
          return;
        }
        buy(R.getItem(b.dataset.id));
      });
    });
    app.querySelectorAll('.toggle').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.id;
      const st = R.save.stored;
      if (st.includes(id)) st.splice(st.indexOf(id), 1); else st.push(id);
      R.persist();
      renderShop();
    }));
  }

  function buy(it) {
    const s = R.save;
    if (s.owned.includes(it.id) || s.fish < it.price || !itemUnlocked(it)) return;
    s.fish -= it.price;
    s.owned.push(it.id);
    R.persist();
    R.fx.play('coin');
    room = it.room;
    catSpot = 0;
    go('house');
    const g = app.querySelector(`.scene .item[data-item="${it.id}"]`);
    if (g) g.classList.add('pop-in');
    R.fx.sakura(40);
    const wasLocked = Object.keys(R.house.ROOMS).filter(id => R.house.ROOMS[id].unlock && s.owned.length === R.house.ROOMS[id].unlock.owned);
    R.fx.toast(wasLocked.length
      ? `🎉 Le <b>${esc(R.house.ROOMS[wasLocked[0]].name)}</b> est maintenant ouvert !`
      : `✨ ${esc(it.name)} est dans ta maison !`, 2800);
    setTimeout(announceTrophies, 2900);
  }

  /* ---------- Moi (profil, trophées, réglages) ---------- */

  function renderMe() {
    const s = R.save;
    render(`
      ${statsBar()}
      <h2 class="page-title">🏆 Mon profil</h2>
      <section class="panel">
        <div class="me-head">
          <div class="me-cat">${R.cat.catSVG('happy', 96)}</div>
          <div class="me-fields">
            <label>Mon prénom <input id="pname" type="text" maxlength="20" value="${esc(s.playerName)}" autocomplete="off" spellcheck="false"></label>
            <label>Nom de mon chat <input id="cname" type="text" maxlength="20" value="${esc(s.catName)}" autocomplete="off" spellcheck="false"></label>
          </div>
        </div>
        <div class="coats">
          ${Object.entries(R.cat.COATS).map(([id, c]) => `<button type="button" class="coat ${s.catColor === id ? 'active' : ''}" data-coat="${id}" style="--fur:${c.fur}">${esc(c.name)}</button>`).join('')}
        </div>
      </section>

      <section class="panel">
        <h3>📊 Mes stats</h3>
        <div class="stat-grid">
          <div><b>${s.sessions}</b><span>sessions</span></div>
          <div><b>${s.perfectSessions}</b><span>sans faute</span></div>
          <div><b>${s.fishEarned}</b><span>🐟 gagnés</span></div>
          <div><b>${s.bestCombo}</b><span>meilleur combo</span></div>
          <div><b>${s.streak.best}</b><span>jours d'affilée (record)</span></div>
          <div><b>${s.owned.length}/${R.items.length}</b><span>objets</span></div>
        </div>
      </section>

      <section class="panel">
        <h3>🏆 Trophées (${s.trophies.length}/${TROPHIES.length})</h3>
        <div class="trophies">
          ${TROPHIES.map(t => `<div class="trophy ${s.trophies.includes(t.id) ? 'won' : ''}">
            <span class="t-emoji">${s.trophies.includes(t.id) ? t.emoji : '🔒'}</span>
            <b>${esc(t.name)}</b><small>${esc(t.desc)}</small></div>`).join('')}
        </div>
      </section>

      <section class="panel">
        <h3>⚙️ Réglages</h3>
        <label class="switch"><input id="sound" type="checkbox" ${s.sound ? 'checked' : ''}> Sons et miaulements</label>
        ${R.storageOk ? '' : '<p class="warn">⚠️ Ce navigateur ne permet pas de sauvegarder. Ouvre l\'appli depuis un vrai navigateur (Chrome, Safari, Firefox).</p>'}
      </section>

      <section class="panel">
        <h3>💾 Sauvegarde (changer d'appareil)</h3>
        <p class="muted">Copie ce code et colle-le sur l'autre appareil pour retrouver tes poissons, étoiles et objets.</p>
        <textarea id="export" readonly rows="3"></textarea>
        <div class="row"><button type="button" class="btn small" id="copy">📋 Copier mon code</button></div>
        <textarea id="import" rows="3" placeholder="Colle ici un code de sauvegarde…"></textarea>
        <div class="row"><button type="button" class="btn small" id="doImport">📥 Charger ce code</button></div>
      </section>

      <section class="panel danger-zone">
        <h3>🧹 Tout recommencer</h3>
        <p class="muted">Efface poissons, étoiles, objets et trophées.</p>
        <button type="button" class="btn small danger" id="reset">Tout effacer</button>
      </section>

      <p class="muted center small">Mochi &amp; les Mots · ${R.exercises.length} leçons · ${R.items.length} objets</p>`);

    const pname = app.querySelector('#pname');
    const cname = app.querySelector('#cname');
    pname.addEventListener('change', () => { s.playerName = pname.value.trim(); R.persist(); });
    cname.addEventListener('change', () => { s.catName = cname.value.trim() || 'Mochi'; R.persist(); });
    app.querySelectorAll('.coat').forEach(b => b.addEventListener('click', () => {
      s.catColor = b.dataset.coat; R.persist(); R.fx.play('meow'); renderMe();
    }));
    app.querySelector('#sound').addEventListener('change', e => { s.sound = e.target.checked; R.persist(); });

    const exp = app.querySelector('#export');
    exp.value = R.exportCode();
    app.querySelector('#copy').addEventListener('click', () => {
      exp.select();
      const done = () => R.fx.toast('📋 Code copié !');
      if (navigator.clipboard) navigator.clipboard.writeText(exp.value).then(done, () => { document.execCommand('copy'); done(); });
      else { document.execCommand('copy'); done(); }
    });
    app.querySelector('#doImport').addEventListener('click', () => {
      try {
        R.importCode(app.querySelector('#import').value);
        R.fx.toast('✅ Sauvegarde chargée !');
        go('house');
      } catch (e) {
        R.fx.toast('❌ Ce code ne marche pas…');
      }
    });
    const reset = app.querySelector('#reset');
    let armed = false;
    reset.addEventListener('click', () => {
      if (!armed) {
        armed = true;
        reset.textContent = 'Vraiment tout effacer ? Touche encore';
        setTimeout(() => { if (reset.isConnected) { armed = false; reset.textContent = 'Tout effacer'; } }, 4000);
        return;
      }
      R.reset();
      startIntro();
    });
  }

  /* ---------- Première visite ---------- */

  const WELCOME_GIFT = 20;

  function startIntro() {
    document.body.classList.add('in-lesson');
    render(`
      <div class="intro">
        <div class="intro-cat">${R.cat.catSVG('happy', 160)}</div>
        <div class="bubble big">
          <p><b>Konnichiwa !</b> 👋 Je m'appelle <b>Mochi</b>.</p>
          <p>Je viens d'emménager dans une <b>maison japonaise</b>… mais elle est toute vide ! 😿</p>
          <p>Chaque fois que tu réussis une question de français, tu gagnes des <b>poissons 🐟</b>. Avec, on achète des meubles pour ma maison et mon jardin !</p>
        </div>
        <label class="intro-name">Comment tu t'appelles ?
          <input id="intro-name" type="text" maxlength="20" autocomplete="off" spellcheck="false" placeholder="Ton prénom">
        </label>
        <button class="btn primary big" type="button" id="intro-go">C'est parti ! 🐾</button>
      </div>`);
    app.querySelector('.intro-cat').addEventListener('click', e => { R.fx.play('meow'); R.fx.hearts(e.currentTarget); });
    app.querySelector('#intro-go').addEventListener('click', () => {
      const s = R.save;
      s.playerName = app.querySelector('#intro-name').value.trim();
      s.introDone = true;
      s.fish += WELCOME_GIFT;
      R.persist();
      R.fx.play('coin');
      shopRoom = 'salon';
      go('shop');
      R.fx.toast(`🎁 Cadeau de bienvenue : ${WELCOME_GIFT} 🐟 ! Choisis ton premier objet.`, 4000);
    });
  }

  /* ---------- Démarrage ---------- */

  R.lesson.init({ render, go, checkTrophies, itemUnlocked });

  document.querySelectorAll('#tabbar button').forEach(b => b.addEventListener('click', () => {
    R.fx.play('tap');
    go(b.dataset.tab);
  }));

  // index.html#demo, #demo/lessons, #demo/shop, #demo/me, #demo/jardin, #demo/lesson/<id>
  const demo = location.hash.match(/^#demo(?:\/([\w-]+))?(?:\/([\w-]+))?/);
  if (demo) {
    R.startDemo();
    document.body.classList.add('demo');
    const [, a, b] = demo;
    if (a === 'jardin') { room = 'jardin'; go('house'); }
    else if (a === 'lesson' && b) R.lesson.showSheet(b);
    else if (a === 'quiz' && b) R.lesson.startQuiz(b);
    else go(['lessons', 'shop', 'me'].includes(a) ? a : 'house');
  } else if (!R.save.introDone) startIntro();
  else go('house');
})();

</script>
